<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

<style>
  :root {
    color-scheme: light;
    --font-main: 'InterDisplay', 'InterVariable', Inter, sans-serif;
    --font-secondary: 'InterVariable', Inter, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --background-color: #fbfaf7;
    --link-color: #0000ff;
    --visited-color: #0000ff;
    font-feature-settings: 'liga' 1, 'calt' 1;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --background-color: #fbfaf7;
      --heading-color: #222;
      --text-color: #444;
      --link-color: #0000ff;
      --visited-color: #0000ff;
      --blockquote-color: #222;
    }
  }

  body {
    max-width: 65ch;
  }

  h1, h2, h3, h4, h5, h6 {
    text-wrap: balance;
  }

  @media (hover: none) {
    a:hover {
      text-decoration: none;
    }
    .post-nav a:hover .nav-label {
      text-decoration: none;
    }
  }

  time,
  code,
  .highlight pre,
  .code pre {
    font-family: var(--font-mono);
  }

  .arrow {
    color: var(--heading-color);
  }

  header .title h2 {
    font-weight: 900;
  }

  content ul:not(.blog-posts) {
    list-style: none;
    padding-left: 1.2em;
  }

  content ul:not(.blog-posts) li::before {
    content: "→";
    display: inline-block;
    width: 1.2em;
    margin-left: -1.2em;
    color: var(--heading-color);
  }

  .post-nav a:hover {
    text-decoration: none;
  }

  .post-nav a:hover .nav-label {
    text-decoration: underline;
  }

  footer {
    text-align: left;
    user-select: none;
    -webkit-user-select: none;
  }

  footer .footer-year {
    font-family: var(--font-main);
    color: var(--heading-color);
  }

  footer .footer-sep {
    color: var(--text-color);
    opacity: 0.5;
  }

  footer .footer-brand {
    font-family: var(--font-main);
    font-weight: 900;
  }

  #back-to-top {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 44px;
    height: 44px;
    border-radius: 0;
    border: 1px solid var(--heading-color);
    background-color: var(--background-color);
    color: var(--heading-color);
    font-family: var(--font-main);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    z-index: 100;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #back-to-top[hidden] {
    display: none;
  }

  #back-to-top:hover {
    background-color: var(--heading-color);
    color: var(--background-color);
  }
</style>
