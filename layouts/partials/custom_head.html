<link rel="canonical" href="{{ .Permalink }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ with .Title }}{{ . }}{{ else }}{{ .Site.Title }}{{ end }}">
<meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">

<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

<style>
  :root {
    color-scheme: light;
    --font-main: 'InterDisplay', 'InterVariable', Inter, sans-serif;
    --font-secondary: 'InterVariable', Inter, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --link-color: #0000ff;
    --visited-color: #0000ff;
    font-feature-settings: 'liga' 1, 'calt' 1;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --background-color: #fff;
      --heading-color: #222;
      --text-color: #444;
      --link-color: #0000ff;
      --visited-color: #0000ff;
      --blockquote-color: #222;
    }
  }

  html {
    scroll-behavior: smooth;
  }

  @media (prefers-reduced-motion: reduce) {
    html {
      scroll-behavior: auto;
    }
  }

  time,
  code,
  .highlight pre,
  .code pre {
    font-family: var(--font-mono);
  }

  a.url-link {
    font-family: var(--font-mono);
  }

  .arrow {
    color: var(--link-color);
  }

  .arrow-heading {
    color: var(--heading-color);
  }

  header .title h1,
  header .title .site-title {
    font-family: var(--font-main);
    color: var(--heading-color);
    font-weight: 900;
    font-size: 1.5em;
    margin: 0.67em 0;
    line-height: 1.2;
  }

  content ul:not(.blog-posts) {
    list-style: none;
    padding-left: 1.2em;
  }

  content ul:not(.blog-posts) li::before {
    content: "→";
    display: inline-block;
    width: 1.2em;
    margin-left: -1.2em;
    color: var(--link-color);
  }

  content ul:not(.blog-posts) a {
    font-family: var(--font-mono);
  }

  footer {
    text-align: center;
    user-select: none;
    -webkit-user-select: none;
  }

  footer .footer-brand {
    font-family: var(--font-main);
    font-weight: 900;
  }

  footer .footer-reg {
    color: var(--heading-color);
  }

  footer .footer-sep {
    color: var(--text-color);
    opacity: 0.5;
  }

  footer .footer-year {
    font-family: var(--font-main);
    font-feature-settings: 'zero' 1;
  }

  footer a.footer-brand:hover {
    text-decoration: none;
  }

  footer a.back-to-top:hover {
    text-decoration: none;
  }
</style>
